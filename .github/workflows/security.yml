name: "NutriCare – Security Pipeline"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:

  # =========================
  # 1. SAST – Semgrep
  # =========================
  sast:
    name: "1 · SAST – Semgrep"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "auto"
        continue-on-error: true

      - name: Generate Semgrep JSON
        if: always()
        run: |
          pip install semgrep --quiet
          semgrep --config auto . --json --output semgrep.json || true

      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep.json


  # =========================
  # 2. SCA – Dependency Check (FIX FINAL)
  # =========================
  sca:
    name: "2 · SCA – Dependency-Check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Dependency Check (robusto)
        run: |
          mkdir -p reports

          docker run --rm \
            -v $(pwd):/src \
            -v $(pwd)/reports:/report \
            owasp/dependency-check \
            --project "nutricare" \
            --scan /src \
            --format HTML \
            --out /report || true

          # Garante evidência mesmo se falhar
          if [ ! -f reports/dependency-check-report.html ]; then
            echo "<html><body><h1>SCA não executado (falha NVD)</h1></body></html>" > reports/dependency-check-report.html
          fi

      - name: Upload Dependency Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-report
          path: reports/


  # =========================
  # 3. Secret Scan – Gitleaks
  # =========================
  secrets:
    name: "3 · Secret Scan – Gitleaks"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true


  # =========================
  # 4. Build – Java
  # =========================
  build:
    name: "4 · Build – Java"
    runs-on: ubuntu-latest
    needs: [sast, sca, secrets]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build Project (fix mvnw)
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ./mvnw clean compile -DskipTests
          else
            mvn clean compile -DskipTests
          fi

      - name: Pipeline Summary
        if: always()
        run: |
          echo "===================================="
          echo " NutriCare - Security Pipeline"
          echo "===================================="
          echo " Repo   : ${{ github.repository }}"
          echo " Branch : ${{ github.ref_name }}"
          echo " Commit : ${{ github.sha }}"
          echo " Autor  : ${{ github.actor }}"
          echo " Data   : $(date)"
          echo "===================================="
