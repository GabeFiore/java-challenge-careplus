name: "NutriCare – Security Pipeline"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:

  # =========================
  # SAST – Semgrep
  # =========================
  sast-semgrep:
    name: "1 · SAST – Semgrep"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "auto"
        continue-on-error: true

      - name: Save Semgrep report
        if: always()
        run: |
          pip install semgrep --quiet
          semgrep --config auto . --json --output semgrep.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep.json


  # =========================
  # SCA – Dependency Check
  # =========================
  sca-dependency-check:
    name: "2 · SCA – Dependency-Check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Dependency Check (Docker FIX)
        run: |
          mkdir reports
          docker run --rm \
            -v $(pwd):/src \
            -v $(pwd)/reports:/report \
            owasp/dependency-check \
            --project "nutricare" \
            --scan /src \
            --format HTML \
            --out /report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-report
          path: reports


  # =========================
  # Secret Scan – Gitleaks
  # =========================
  secret-scan:
    name: "3 · Secret Scan – Gitleaks"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_linux_x64.tar.gz
          tar -xzf gitleaks_linux_x64.tar.gz
          chmod +x gitleaks
          ./gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.json


  # =========================
  # BUILD
  # =========================
  build:
    name: "4 · Build – Java"
    runs-on: ubuntu-latest
    needs: [sast-semgrep, sca-dependency-check, secret-scan]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build 
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ./mvnw clean compile -DskipTests
          else
            mvn clean compile -DskipTests
          fi
