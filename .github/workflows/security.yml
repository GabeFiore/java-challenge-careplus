name: "NutriCare – Security Pipeline"

# Executa em todo push e pull request para qualquer branch
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:

  # ══════════════════════════════════════════════
  # ETAPA 1 – SAST com Semgrep
  # Analisa o código-fonte Java em busca de
  # vulnerabilidades sem precisar compilar.
  # ══════════════════════════════════════════════
  sast-semgrep:
    name: "1 · SAST – Semgrep"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Executar Semgrep (regras Java + OWASP Top 10)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >
            p/java
            p/owasp-top-ten
            p/secrets
        continue-on-error: true

      - name: Gerar relatório JSON do Semgrep
        if: always()
        run: |
          pip install semgrep --quiet
          semgrep --config "p/java" \
                  --config "p/owasp-top-ten" \
                  --config "p/secrets" \
                  src/ \
                  --json \
                  --output semgrep-report.json \
                  --no-strict || true
          echo "Semgrep concluido"

      - name: Salvar relatório Semgrep como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 30

  # ══════════════════════════════════════════════
  # ETAPA 2 – SCA com OWASP Dependency-Check
  # Cruza as dependências do pom.xml com o banco
  # de CVEs da NIST para encontrar bibliotecas
  # com vulnerabilidades conhecidas.
  # ══════════════════════════════════════════════
  sca-dependency-check:
    name: "2 · SCA – OWASP Dependency-Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Executar OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "NutriCare API – Care Plus"
          path: "."
          format: "HTML"
          args: >
            --failOnCVSS 7
            --enableRetired
        continue-on-error: true

      - name: Salvar relatório do Dependency-Check como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 30

  # ══════════════════════════════════════════════
  # ETAPA 3 – Secret Scan com Gitleaks
  # Varre o histórico completo de commits do
  # repositório procurando credenciais, tokens,
  # chaves de API e senhas expostas.
  # ══════════════════════════════════════════════
  secret-scan-gitleaks:
    name: "3 · Secret Scan – Gitleaks"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completo (histórico completo para o Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Gerar relatório JSON do Gitleaks
        if: always()
        run: |
          # Baixa o binário do Gitleaks diretamente
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
          chmod +x gitleaks

          # Executa e salva relatório JSON
          ./gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks-report.json \
            --verbose || true

          echo "Gitleaks concluido"

      - name: Salvar relatório do Gitleaks como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  # ══════════════════════════════════════════════
  # ETAPA 4 – Build de verificação
  # Compila o projeto para confirmar que o código
  # está íntegro. Pula testes unitários pois o
  # banco MySQL não está disponível no runner.
  # ══════════════════════════════════════════════
  build-verify:
    name: "4 · Build – Compilação Java"
    runs-on: ubuntu-latest
    needs: [sast-semgrep, sca-dependency-check, secret-scan-gitleaks]
    if: always()

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Compilar o projeto (sem testes – banco não disponível no CI)
        run: |
          ./mvnw clean compile \
            -DskipTests=true \
            --no-transfer-progress
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/care_plus_db
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          JWT_TOKEN: ci-build-placeholder-token

      - name: Exibir resumo do build
        if: always()
        run: |
          echo "=========================================="
          echo "  NutriCare – Resumo do Pipeline"
          echo "=========================================="
          echo "  Repositório : ${{ github.repository }}"
          echo "  Branch      : ${{ github.ref_name }}"
          echo "  Commit      : ${{ github.sha }}"
          echo "  Autor       : ${{ github.actor }}"
          echo "  Data/Hora   : $(date '+%d/%m/%Y %H:%M:%S')"
          echo "=========================================="
